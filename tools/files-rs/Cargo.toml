[package]
name = "t2r-files"
version = "0.2.0"
edition = "2021"
description = "Twelve Weeks update server: blobs by sendfile, the launcher API, bug reports"

[[bin]]
name = "t2r-files"
path = "src/main.rs"

[dependencies]
t2r-clan = { path = "../clan-rs" }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
serde = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

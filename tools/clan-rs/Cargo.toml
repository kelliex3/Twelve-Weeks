[package]
name = "t2r-clan"
version = "0.1.0"
edition = "2021"
description = "Twelve Weeks clan views: the clan card, the menu ticker lines (daemon op 0xB4), read-only on t2r.db"

[lib]
name = "t2r_clan"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case", "unicode-gencat"] }
sha2 = "0.10"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

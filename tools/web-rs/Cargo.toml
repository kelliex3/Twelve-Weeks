[package]
name = "t2r-web"
version = "0.1.0"
edition = "2021"
description = "twelve-weeks.com: the public website, its read-only API, Steam login and the news editor"

[[bin]]
name = "t2r-web"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

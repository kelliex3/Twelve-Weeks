[package]
name = "t2r-daemon"
version = "0.2.0"
edition = "2021"
description = "Twelve Weeks game daemon (Rust rewrite of tools/daemon.py)"

[[bin]]
name = "t2r-daemon"
path = "src/main.rs"

[[bin]]
name = "t2r-udp-load"
path = "verify/udp_load.rs"

[features]
default = []
# The private modules (anti-cheat, identity, install check) live in ./private (never on GitHub).
# Without this feature the daemon builds with neutral stubs (src/privstub.rs).
private = []

[dependencies]
indexmap = "2"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
t2r-clanstory = { path = "../clanstory-rs" }
parking_lot = "0.12"
getrandom = "0.2"
sha2 = "0.10"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case", "unicode-gencat"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"   # a panic in one connection / loop thread is caught and logged (Python: the exception), not a process abort
strip = true

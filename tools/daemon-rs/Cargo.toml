[package]
name = "t2r-daemon"
version = "0.1.0"
edition = "2021"
description = "Twelve Weeks game daemon (Rust rewrite of tools/daemon.py), stage 1: the UDP relay"

[[bin]]
name = "t2r-daemon"
path = "src/main.rs"

[[bin]]
name = "t2r-udp-load"
path = "verify/udp_load.rs"

[dependencies]
indexmap = "2"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

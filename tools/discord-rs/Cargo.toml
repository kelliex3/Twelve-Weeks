[package]
name = "twelveweeks-bot"
version = "0.1.0"
edition = "2021"
description = "Twelve Weeks Discord bot: faction and ping buttons, welcome cards, slash commands, the bug-report forum desk and the LIVE PLAYERS counters"

[[bin]]
name = "twelveweeks-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }
twilight-gateway = { version = "0.18", default-features = false, features = ["rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
ab_glyph = "0.2"
png = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
